<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMABA - SMAN 1 Magetan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f4f9 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .gradient-text {
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gradient {
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col items-center mb-8 text-center">
            <img src="https://smasa-magetan.sch.id/wp-content/uploads/2023/06/LOGO-SMA-NEGERI-1-MAGETAN-258x300.png" 
                 alt="Logo SMAN 1 Magetan" 
                 class="w-24 h-auto mb-4 drop-shadow-lg"
                 onerror="this.src='https://via.placeholder.com/100?text=SMASA'">
            <h1 class="text-3xl md:text-4xl font-bold gradient-text">SIMABA SMASA</h1>
            <p class="text-gray-600 mt-2">Sistem Informasi Barang Titipan & Barang Hilang SMAN 1 Magetan</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Section -->
            <div class="lg:col-span-1">
                <div class="glass-card rounded-3xl p-6 border-t-4 border-blue-600">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-gray-800">
                        <i class="fas fa-edit text-blue-600"></i> Input Data
                    </h2>
                    
                    <form id="itemForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Status Barang</label>
                            <select id="type" required class="w-full p-3 rounded-xl border border-gray-200 input-focus bg-white cursor-pointer">
                                <option value="hilang">🔍 Barang Hilang</option>
                                <option value="titipan">📦 Barang Titipan</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Barang</label>
                            <input type="text" id="itemName" placeholder="Contoh: Jaket Hitam" required
                                   class="w-full p-3 rounded-xl border border-gray-200 input-focus">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Pemilik</label>
                                <input type="text" id="ownerName" placeholder="Nama Lengkap" required
                                       class="w-full p-3 rounded-xl border border-gray-200 input-focus">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                                <input type="text" id="className" placeholder="Contoh: X-A" required
                                       class="w-full p-3 rounded-xl border border-gray-200 input-focus">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Lokasi</label>
                            <input type="text" id="location" placeholder="Contoh: Kantin / Lab Kimia" required
                                   class="w-full p-3 rounded-xl border border-gray-200 input-focus">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Tanggal & Waktu</label>
                            <input type="datetime-local" id="dateTime" required
                                   class="w-full p-3 rounded-xl border border-gray-200 input-focus">
                        </div>

                        <button type="submit" class="w-full btn-gradient text-white font-bold py-4 rounded-xl mt-4 flex items-center justify-center gap-2">
                            <i class="fas fa-save"></i> Simpan Data
                        </button>
                    </form>
                </div>
            </div>

            <!-- List Section -->
            <div class="lg:col-span-2">
                <div class="glass-card rounded-3xl p-6 min-h-[500px]">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h2 class="text-xl font-bold flex items-center gap-2 text-gray-800">
                            <i class="fas fa-list-ul text-blue-600"></i> Daftar Informasi Terbaru
                        </h2>
                        <div class="flex bg-gray-100 p-1 rounded-lg">
                            <button onclick="filterItems('all')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all" id="btn-all">Semua</button>
                            <button onclick="filterItems('hilang')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all" id="btn-hilang">Hilang</button>
                            <button onclick="filterItems('titipan')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all" id="btn-titipan">Titipan</button>
                        </div>
                    </div>

                    <div id="itemsContainer" class="space-y-4">
                        <!-- Data will be injected here -->
                        <div class="text-center py-20 text-gray-400">
                            <i class="fas fa-box-open text-5xl mb-4 opacity-20"></i>
                            <p>Belum ada data yang tercatat hari ini.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 right-8 transform translate-y-20 opacity-0 transition-all duration-300 bg-green-600 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg">Data berhasil disimpan!</span>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL YANG ANDA SALIN TADI
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyj8QDz4_BUYeKoDFxFEBpLe92L1FRX3xHar4MUdjmkdkdehfxtV5dEBrTnfqRk0QVUHg/exec';

const form = document.getElementById('itemForm');

form.addEventListener('submit', async (e) => {
    e.preventDefault(); // Mencegah halaman refresh

    // Mengambil nilai dari input form
    const dataPayload = {
        status_barang: document.getElementById('type').value,
        nama_barang: document.getElementById('itemName').value,
        nama_pemilik: document.getElementById('ownerName').value,
        kelas: document.getElementById('className').value,
        lokasi: document.getElementById('location').value,
        tanggal_waktu: document.getElementById('dateTime').value
    };

    try {
        // Proses mengirim data ke Google Sheets
        const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Penting agar tidak terhalang kebijakan keamanan browser
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dataPayload)
        });

        // Jika berhasil (asumsi sukses karena no-cors tidak bisa baca respon detail)
        alert("✅ Berhasil! Data telah tersimpan di Google Sheets.");
        
        // Simpan juga di tampilan lokal (opsional, sesuai kode lama Anda)
        const newItem = {
            id: Date.now(),
            type: dataPayload.status_barang,
            itemName: dataPayload.nama_barang,
            ownerName: dataPayload.nama_pemilik,
            className: dataPayload.kelas,
            location: dataPayload.lokasi,
            dateTime: dataPayload.tanggal_waktu
        };
        items.unshift(newItem);
        localStorage.setItem('smasa_items', JSON.stringify(items));
        
        form.reset(); // Kosongkan form kembali
        renderItems(); // Perbarui daftar di layar

    } catch (error) {
        console.error('Error:', error);
        alert("❌ Waduh, ada masalah saat mengirim data. Coba lagi ya!");
    }
});
    </script>
</body>
</html>
